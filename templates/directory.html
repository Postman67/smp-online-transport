{% extends "base.html" %}

{% block title %}Directory - Transport Directory{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title mb-0">Waystones Directory</h3>
                <div>
                    <input type="text" id="search-input" class="form-control" placeholder="Search waystones..." style="width: 300px;">
                </div>
            </div>
            <div class="card-body">
                <div id="loading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Loading directory data...</p>
                </div>
                <div id="error-message" class="error" style="display: none;"></div>
                <div id="directory-content" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Icon</th>
                                    <th>Name</th>
                                    <th>Key</th>
                                    <th>Coordinates</th>
                                    <th>Type</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="directory-table-body">
                                <!-- Directory entries will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for detailed view -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Details will be populated here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <a href="#" id="viewOnMapBtn" class="btn btn-primary">View on Map</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-message');
    const contentEl = document.getElementById('directory-content');
    const tableBody = document.getElementById('directory-table-body');
    const searchInput = document.getElementById('search-input');
    
    let directoryData = [];
    let filteredData = [];
    
    // Fetch directory data
    fetch('/api/directory')
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                throw new Error(data.error);
            }
            
            directoryData = data;
            filteredData = data;
            
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            
            renderTable();
            
        })
        .catch(error => {
            console.error('Error loading directory data:', error);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorEl.innerHTML = `<strong>Error:</strong> ${error.message}`;
        });
    
    // Search functionality
    searchInput.addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase();
        
        if (searchTerm === '') {
            filteredData = directoryData;
        } else {
            filteredData = directoryData.filter(item => 
                item.name.toLowerCase().includes(searchTerm) ||
                item.key.toLowerCase().includes(searchTerm) ||
                item.tooltip.toLowerCase().includes(searchTerm) ||
                item.popup.toLowerCase().includes(searchTerm)
            );
        }
        
        renderTable();
    });
    
    function renderTable() {
        tableBody.innerHTML = '';
        
        filteredData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <img src="/static/images/${item.image}.png" 
                         alt="Waystone" 
                         style="width: 32px; height: 32px;">
                </td>
                <td>
                    <strong>${item.name}</strong>
                </td>
                <td>
                    <code style="font-size: 0.8em;">${item.key}</code>
                </td>
                <td>
                    <small>X: ${item.coordinates.x}, Z: ${item.coordinates.z}</small>
                </td>
                <td>
                    <span class="badge bg-danger">${item.type}</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="showDetails('${item.id}')">
                        Details
                    </button>
                </td>
            `;
            
            tableBody.appendChild(row);
        });
        
        // Update table info
        const totalCount = filteredData.length;
        const tableInfo = document.querySelector('.table-responsive');
        if (!document.getElementById('table-info')) {
            const infoDiv = document.createElement('div');
            infoDiv.id = 'table-info';
            infoDiv.className = 'mt-2 text-muted small';
            tableInfo.appendChild(infoDiv);
        }
        document.getElementById('table-info').textContent = `Showing ${totalCount} ${totalCount === 1 ? 'waystone' : 'waystones'}`;
    }
    
    // Show details modal
    window.showDetails = function(id) {
        const item = directoryData.find(d => d.id === id);
        if (!item) return;
        
        document.getElementById('modalTitle').textContent = item.name;
        document.getElementById('modalBody').innerHTML = `
            <div class="row">
                <div class="col-md-6">
                    <div class="text-center mb-3">
                        <img src="/static/images/${item.image}.png" 
                             alt="Waystone Marker" 
                             style="width: 64px; height: 64px;">
                    </div>
                    <h6>Waystone Information</h6>
                    <p><strong>Key:</strong> <code>${item.key}</code></p>
                    <p><strong>Type:</strong> <span class="badge bg-danger">${item.type}</span></p>
                    <p><strong>Tooltip:</strong> ${item.tooltip}</p>
                </div>
                <div class="col-md-6">
                    <h6>Location Information</h6>
                    <p><strong>Coordinates:</strong><br>X: ${item.coordinates.x}<br>Z: ${item.coordinates.z}</p>
                    <p><strong>Popup Content:</strong> ${item.popup}</p>
                    <p><strong>Image:</strong> ${item.image}.png</p>
                </div>
            </div>
        `;
        
        document.getElementById('viewOnMapBtn').href = `/?highlight=${id}`;
        
        const modal = new bootstrap.Modal(document.getElementById('detailModal'));
        modal.show();
    };
});
</script>
{% endblock %}
